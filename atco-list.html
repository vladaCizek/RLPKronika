<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/overflow.css" />
    <title>ATCO List - Řízení Letového Provozu Ostrava</title>
  </head>
  <body>
    <div id="navigation" data-page="atco-list.html" data-theme="dark"></div>

    <section>
      <div class="wrapper">
        <div class="text-center mb-12">
          <h1 class="text-5xl font-bold text-gray-900 mb-6">ATCO List</h1>
          <p class="text-xl text-gray-600 font-medium max-w-4xl mx-auto">Seznam řídících letového provozu (Air Traffic Control Officers) působících na letišti Ostrava.</p>
        </div>

        <div id="bio-list" class="max-w-6xl mx-auto">
          <!-- Bio components will be inserted here -->
        </div>
      </div>
    </section>

    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/image-handler.js"></script>
    <script src="data/atco-data.js"></script>
    <script>
      // Bio component class
      class BioComponent {
        constructor(data) {
          this.data = data;
        }

        render() {
          const bioCard = document.createElement("div");
          bioCard.className = "flex items-start gap-4 bg-white rounded-lg p-6 mb-6 shadow-lg";

          // Create image container using ImageHandler
          const imageHandler = new ImageHandler(
            this.data.image,
            this.data.imageDescription || this.data.bio.name
          );
          const imageContainer = imageHandler.createImageContainer();
          imageContainer.className = "flex justify-center items-center w-32 h-32 rounded-lg bg-gray-200";

          const imgElement = imageContainer.querySelector('img');
          if (imgElement) {
            imgElement.className = "object-contain";
          }

          // Create content
          const bioContent = document.createElement("div");
          bioContent.className = "flex-1 text-left";
          
          bioContent.innerHTML = `
            <div class="w-full pb-2 mb-2 border-b-1 border-gray-200">
              <h3 class="text-2xl font-extrabold text-gray-700 mb-1">${this.data.bio.name}</h3>
              <div class="text-base font-medium text-gray-600 mb-1">${this.formatDates()}</div>
            </div>
            <div class="flex flex-col gap-4 mt-6">
              <div class="grid grid-cols-3 gap-4 mb-6">
                ${this.formatBasicInfo()}
                ${this.formatLicences()}
                ${this.formatInstruktorInfo()}
              </div>
              <div>
                ${this.formatAdditionalInfo()}
              </div>
            </div>
          `;

          bioCard.appendChild(imageContainer);
          bioCard.appendChild(bioContent);
          
          return bioCard;
        }

        formatDates() {
          let dates = '';
          if (this.data.bio.dob) {
            dates += `*${this.data.bio.dob}`;
          }
          if (this.data.bio.dod) {
            dates += ` +${this.data.bio.dod}`;
          }
          return dates;
        }

        formatBasicInfo() {
          if (!this.data.bio.nastup && !this.data.bio.odchod) return '';
          
          return `
            <div class="bio-section basic-info">
              <div class="bio-section-content">
                ${this.data.bio.nastup ? `<p class="mb-0"><span class="font-bold text-gray-700">Nástup:</span> ${this.data.bio.nastup}</p>` : ''}
                ${this.data.bio.odchod ? `<p class="mb-0"><span class="font-bold text-gray-700">Odchod:</span> ${this.data.bio.odchod}</p>` : ''}
              </div>
            </div>
          `;
        }

        formatLicences() {
          if (!this.data.licence.licences || this.data.licence.licences.length === 0) return '';
          
          let licenceContent = '';
          this.data.licence.licences.forEach(licence => {
            for (const [key, value] of Object.entries(licence)) {
              licenceContent += `<p class="mb-0"><span class="font-bold text-gray-700">${key}:</span> ${value}</p>`;
            }
          });
          
          return `
            <div class="bio-section licences">
              <div class="bio-section-content">
                ${licenceContent}
              </div>
            </div>
          `;
        }

        formatInstruktorInfo() {
          if (!this.data.instruktor || this.data.instruktor.length === 0) return '';
          
          let instruktorContent = '';
          this.data.instruktor.forEach(inst => {
            for (const [key, value] of Object.entries(inst)) {
              instruktorContent += `<p class="mb-0"><span class="font-bold text-gray-700">${key}:</span> ${value}</p>`;
            }
          });
          
          return `
            <div>
              ${instruktorContent}
            </div>
          `;
        }

        formatAdditionalInfo() {
          if (!this.data.info) return '';
          
          return `
            <div>
              <p class="mb-0 text-base text-gray-800"><span class="font-bold text-gray-700">Dodatečné informace:</span> ${this.data.info}</p>
            </div>
          `;
        }
      }

      // Render bio components when page loads
      function renderBioList() {
        const bioListContainer = document.getElementById('bio-list');
        
        bioData.forEach(data => {
          const bio = new BioComponent(data);
          bioListContainer.appendChild(bio.render());
        });
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', renderBioList);
    </script>
  </body>
</html>
