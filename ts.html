<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <title>TS - Řízení Letového Provozu Ostrava</title>
  </head>
  <body>
    <div id="navigation" data-page="ts.html" data-theme="dark"></div>

    <section>
      <div class="wrapper">
        <div class="text-center mb-12">
          <h1 class="text-5xl font-bold text-gray-900 mb-6">TS</h1>
          <p class="text-xl text-gray-600 font-medium mb-4">Seznam technických specialistů (Technical Specialists) pracujících na letišti Ostrava.</p>
          <p class="text-lg text-gray-700 mb-2">Kde bychom byli bez našich techniků, kteří se nám starají o funkčnost stanoviště</p>
          <p class="text-base font-semibold text-gray-800">Řazení podle nástupů k podniku</p>
        </div>
        <div id="ts-content" class="max-w-6xl mx-auto"></div>
      </div>
    </section>

    <script src="assets/js/navigation.js"></script>
    <script src="data/ts-data.js"></script>
    <script>
      const TS_DATA = {
        header: "Kde bychom byli bez našich techniků, kteří se nám starají o funkčnost stanoviště",
        subtitle: "Řazení podle nástupů k podniku",
        personnel: ts_personnel
      };

      function renderTSTable() {
        const container = document.getElementById('ts-content');
        
        const personnelRows = TS_DATA.personnel.map(person => {
          if (person.isHeader) {
            return `
              <tr class="bg-sky-100">
                <td class="px-4 py-2 border-b border-b-solid border-gray-300 text-gray-800"><strong>${person.name}</strong></td>
                <td class="px-4 py-2 border-b border-b-solid border-gray-300"></td>
              </tr>
            `;
          } else {
            return `
              <tr class="hover:bg-gray-50 text-gray-600">
                <td class="px-4 py-2 border-b border-b-solid border-gray-300">${person.name}</td>
                <td class="px-4 py-2 border-b border-b-solid border-gray-300">${person.details || ''}</td>
              </tr>
            `;
          }
        }).join('');

        const html = `
          <table class="table border-collapse w-full">
            <thead>
              <tr>
                <th class="px-4 py-3 bg-gray-100 border-b border-b-solid border-gray-500 font-semibold text-left">Jméno</th>
                <th class="px-4 py-3 bg-gray-100 border-b border-b-solid border-gray-500 font-semibold text-left">Doba na AD - profese</th>
              </tr>
            </thead>
            <tbody>
              ${personnelRows}
            </tbody>
          </table>
        `;

        container.innerHTML = html;
      }

      document.addEventListener('DOMContentLoaded', renderTSTable);
    </script>
  </body>
</html>
