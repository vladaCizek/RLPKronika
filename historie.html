<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <title>Historie - Řízení Letového Provozu Ostrava</title>
  </head>
  <body class="no-paragraph-margin">
    <div id="navigation" data-page="historie.html" data-theme="dark"></div>

    <section id="historie-content">
      <!-- Content will be dynamically loaded here -->
    </section>

    <script src="assets/js/navigation.js"></script>
    <script src="data/historie-data.js"></script>
    <script>
      function renderHistorie() {
        const container = document.getElementById('historie-content');

        function renderNavigation() {
          return HISTORIE_DATA.navigation.map(navItem => `
            <a href="${navItem.href}">
              ${navItem.label}
            </a>
          `).join('');
        }

        function renderSectionDescription(section) {
          let html = '';

          // If there's descriptive content, integrate images into it for text flow
          if (section.content.description) {
            html += '<div class="description-with-images">';
            html += renderSectionImages(section);
            html += section.content.description.map(paragraph =>
              `<p>${paragraph}</p>`
            ).join('');
            html += '</div>';
          }

          return html;
        }

        function renderImagesRow(section) {
          // If no description, render images as a flex row
          if (!section.content.description && section.images.length > 0) {
            return `<div class="images-row">${renderSectionImages(section)}</div>`;
          }
          return '';
        }

        function renderSectionTimeline(section) {
          let html = '';

          // Render timeline if present
          if (section.content.timeline) {
            section.content.timeline.forEach(timelineItem => {
              html += `<h4>${timelineItem.year}</h4>`;
              if (timelineItem.events.length === 1) {
                html += `<p>${timelineItem.events[0]}</p>`;
              } else {
                html += timelineItem.events.map(event => {
                  if (event.includes('–') || event.includes('-')) {
                    // Handle multi-part events with dates
                    return `<p><strong>${event.split(' ')[0]}</strong> ${event.substring(event.indexOf(' ') + 1)}</p>`;
                  } else {
                    return `<p>${event}</p>`;
                  }
                }).join('');
              }
            });
          }

          // Render additional info if present
          if (section.content.additionalInfo) {
            html += section.content.additionalInfo.map(info =>
              `<p>${info}</p>`
            ).join('');
          }

          return html;
        }

        function renderSectionImages(section) {
          return section.images.map(image => `
            <figure>
              <img src="${image.src}" alt="${image.alt}" onerror="this.style.display='none'">
              <figcaption><small>${image.caption}</small></figcaption>
            </figure>
          `).join('');
        }

        function renderSections() {
          return HISTORIE_DATA.sections.map(section => `
            <section id="${section.id}">
              <div>
                <h2>${section.title}</h2>
                ${renderSectionDescription(section)}
                ${renderImagesRow(section)}
                <div class="timeline-content">
                  ${renderSectionTimeline(section)}
                </div>
              </div>
            </section>
          `).join('');
        }

        const html = `
          <div class="wrapper">
            <div>
              <!-- Sidebar Navigation -->
              <div>
                <nav>
                  <p>Historická období</p>
                  ${renderNavigation()}
                </nav>
              </div>

              <!-- Main Content -->
              <div>
                <div>
                  <h1>${HISTORIE_DATA.title}</h1>
                  <p>${HISTORIE_DATA.description}</p>
                   <h3>1936-2026</h3>

                  ${renderSections()}

                </div>
              </div>
            </div>
          </div>
        `;

        container.innerHTML = html;

        // Initialize scroll navigation after content is loaded
        initializeScrollNavigation();
      }

      function initializeScrollNavigation() {
        // Smooth scrolling for sidebar navigation links only
        const navLinks = document.querySelectorAll('section nav a');

        navLinks.forEach(link => {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
              targetElement.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
              });

              // Update active state
              navLinks.forEach(l => {
                l.classList.remove('active');
              });
              this.classList.add('active');
            }
          });
        });

        // Highlight current section on scroll
        window.addEventListener('scroll', function() {
          const sections = document.querySelectorAll('section[id]');
          const scrollPos = window.scrollY + 100;

          sections.forEach(section => {
            const top = section.offsetTop;
            const height = section.offsetHeight;
            const id = section.getAttribute('id');

            if (scrollPos >= top && scrollPos < top + height) {
              navLinks.forEach(l => {
                l.classList.remove('active');
              });
              const activeLink = document.querySelector(`a[href="#${id}"]`);
              if (activeLink) {
                activeLink.classList.add('active');
              }
            }
          });
        });
      }

      document.addEventListener('DOMContentLoaded', renderHistorie);
    </script>
  </body>
</html>
