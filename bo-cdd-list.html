<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/overflow.css" />
    <title>BO/CDD List - Řízení Letového Provozu Ostrava</title>
    <style>
      /* Navigation styling */
      #bo-cdd-content nav a {
        color: #374151; /* dark gray */
        text-decoration: none;
        display: block;
        padding: 0.25rem 0;
        border-left: 3px solid transparent;
        transition: all 0.2s ease;
      }

      #bo-cdd-content nav a:visited {
        color: #374151; /* same dark gray for visited */
      }

      #bo-cdd-content nav a:hover {
        color: #111827; /* darker gray on hover */
        border-left-color: #6b7280;
        padding-left: 0.5rem;
      }

      #bo-cdd-content nav a.active {
        color: #111827; /* darker gray for active */
        border-left-color: #374151;
        font-weight: 600;
        padding-left: 0.5rem;
      }

      #bo-cdd-content nav a:focus {
        outline: none;
      }

      /* Main content area */
      #bo-cdd-content .flex-1 {
        position: relative;
        padding-left: 3rem;
      }

      /* Continuous timeline border */
      #bo-cdd-content .flex-1::before {
        content: '';
        position: absolute;
        left: 0.5rem;
        top: 30px;
        bottom: 60px;
        width: 3px;
        background-color: #e9eaeb;
        z-index: 1;
      }

      #bo-cdd-content section {
        position: relative;
        margin-bottom: 3rem;
      }

      #bo-cdd-content section h2 {
        position: relative;
        margin-bottom: 1.5rem;
      }

      /* Timeline dots for main section titles */
      #bo-cdd-content section h2::before {
        content: '';
        position: absolute;
        left: -2.9rem;
        top: 1rem;
        width: 16px;
        height: 16px;
        background-color: white;
        border: 3px solid #374151;
        border-radius: 50%;
        box-shadow: 0 0 0 6px white;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="navigation" data-page="bo-cdd-list.html" data-theme="dark"></div>

    <section id="bo-cdd-content">
      <!-- Content will be dynamically loaded here -->
    </section>

    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/image-handler.js"></script>
    <script src="data/bo-cdd-data.js"></script>
    <script type="module">
      // Bio component class
      class BioComponent {
        constructor(data) {
          this.data = data;
        }

        render() {
          const bioCard = document.createElement("div");
          bioCard.className = "flex items-start gap-4 bg-white rounded-lg p-6 mb-6 shadow-lg";

          // Create image using ImageHandler
          const imageHandler = new ImageHandler(this.data.image, this.data.name);
          const imageContainer = imageHandler.createImageContainer();
          imageContainer.className = "flex justify-center items-center w-32 h-32 rounded-lg bg-gray-200";

          const imgElement = imageContainer.querySelector('img');
          if (imgElement) {
            imgElement.className = "object-contain";
          }

          // Create content
          const bioContent = document.createElement("div");
          bioContent.className = "flex-grow text-left";

          bioContent.innerHTML = `
            <h3 class="text-2xl font-extrabold text-gray-900 mb-1">${
              this.data.name
            }</h3>
            <div class="text-base font-medium text-gray-700 mb-1">${this.formatDates()}</div>
            <div class="text-base text-gray-800">
              ${this.formatDetails()}
            </div>
          `;

          bioCard.appendChild(imageContainer);
          bioCard.appendChild(bioContent);

          return bioCard;
        }

        formatDates() {
          let dates = "";
          if (this.data.birthDate) {
            dates += `*${this.data.birthDate}`;
          }
          if (this.data.deathDate) {
            dates += ` +${this.data.deathDate}`;
          }
          return dates;
        }

        formatDetails() {
          let details = "";

          if (this.data.startDate) {
            details += `<p class="mb-0"><span class="font-bold text-gray-900">Nástup:</span> ${this.data.startDate}</p>`;
          }

          if (this.data.licenseBO) {
            details += `<p class="mb-0"><span class="font-bold text-gray-900">Licence BO:</span> ${this.data.licenseBO}</p>`;
          }

          if (this.data.additionalInfo && this.data.additionalInfo.length > 0) {
            this.data.additionalInfo.forEach((info) => {
              details += `<p class="mb-0">${info}</p>`;
            });
          }

          if (this.data.departure) {
            details += `<p class="mb-0"><span class="font-bold text-gray-900">Odchod:</span> ${this.data.departure}</p>`;
          }

          return details;
        }
      }

      // Navigation data for BO/CDD sections
      const BO_CDD_NAVIGATION = [
        { href: "#generation-1940s", label: "40. léta" },
        { href: "#generation-1950s", label: "50. léta" },
        { href: "#generation-1960s", label: "60. léta" },
        { href: "#generation-1970s", label: "70. léta" },
        { href: "#generation-1980s", label: "80. léta" },
        { href: "#generation-1990s", label: "90. léta" },
        { href: "#generation-2000s", label: "2000+" }
      ];

      // Organize bio data by decades based on entry date
      function organizeBioDataByDecades() {
        const sections = {
          "generation-1940s": { title: "40. léta", id: "generation-1940s", data: [] },
          "generation-1950s": { title: "50. léta", id: "generation-1950s", data: [] },
          "generation-1960s": { title: "60. léta", id: "generation-1960s", data: [] },
          "generation-1970s": { title: "70. léta", id: "generation-1970s", data: [] },
          "generation-1980s": { title: "80. léta", id: "generation-1980s", data: [] },
          "generation-1990s": { title: "90. léta", id: "generation-1990s", data: [] },
          "generation-2000s": { title: "2000+", id: "generation-2000s", data: [] }
        };

        bioData.forEach(person => {
          const entryYear = person.startDate;
          if (entryYear) {
            // Extract year from various date formats
            const yearMatch = entryYear.match(/\d{4}/);
            if (yearMatch) {
              const year = parseInt(yearMatch[0]);
              if (year >= 1940 && year < 1950) {
                sections["generation-1940s"].data.push(person);
              } else if (year >= 1950 && year < 1960) {
                sections["generation-1950s"].data.push(person);
              } else if (year >= 1960 && year < 1970) {
                sections["generation-1960s"].data.push(person);
              } else if (year >= 1970 && year < 1980) {
                sections["generation-1970s"].data.push(person);
              } else if (year >= 1980 && year < 1990) {
                sections["generation-1980s"].data.push(person);
              } else if (year >= 1990 && year < 2000) {
                sections["generation-1990s"].data.push(person);
              } else if (year >= 2000) {
                sections["generation-2000s"].data.push(person);
              }
            }
          }
        });

        return Object.values(sections).filter(section => section.data.length > 0);
      }

      function renderNavigation() {
        const sections = organizeBioDataByDecades();
        const availableNavigation = BO_CDD_NAVIGATION.filter(navItem =>
          sections.some(section => section.id === navItem.href.substring(1))
        );

        return availableNavigation.map((navItem, index) => `
          <a href="${navItem.href}" ${index === 0 ? 'class="active"' : ''}>
            ${navItem.label}
          </a>
        `).join('');
      }

      function renderSections() {
        const sections = organizeBioDataByDecades();

        return sections.map(section => `
          <section id="${section.id}">
            <div>
              <h2>${section.title}</h2>
              <div class="bio-list">
                ${section.data.map(person => {
                  const bio = new BioComponent(person);
                  return bio.render().outerHTML;
                }).join('')}
              </div>
            </div>
          </section>
        `).join('');
      }

      function renderBOCDDList() {
        const container = document.getElementById('bo-cdd-content');

        const html = `
          <div class="wrapper">
            <!-- Page Title -->
            <div class="mb-8 pb-6">
              <h1>BO/CDD List</h1>
              <p>Seznam pracovníků Base Operations a Company Dispatch Department na letišti Ostrava.</p>
            </div>

            <div class="flex gap-8">
              <!-- Sidebar Navigation -->
              <div class="w-64 flex-none">
                <div class="sticky top-0" style="position: sticky; top: 1rem;">
                  <nav>
                    <p class="font-bold mb-4 text-blue-700">Generace</p>
                    <div class="pb-4 border-b border-gray-300"></div>
                    <div class="space-y-2 mt-4">
                      ${renderNavigation()}
                    </div>
                  </nav>
                </div>
              </div>

              <!-- Main Content -->
              <div class="flex-1 min-w-0">
                <div>
                  ${renderSections()}
                </div>
              </div>
            </div>
          </div>
        `;

        container.innerHTML = html;

        // Initialize scroll navigation after content is loaded
        initializeScrollNavigation();
      }

      function initializeScrollNavigation() {
        // Smooth scrolling for sidebar navigation links only
        const navLinks = document.querySelectorAll('section nav a');

        navLinks.forEach(link => {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
              targetElement.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
              });

              // Update active state
              navLinks.forEach(l => {
                l.classList.remove('active');
              });
              this.classList.add('active');
            }
          });
        });

        // Highlight current section on scroll
        window.addEventListener('scroll', function() {
          const sections = document.querySelectorAll('section[id]');
          const scrollPos = window.scrollY + 100;

          sections.forEach(section => {
            const top = section.offsetTop;
            const height = section.offsetHeight;
            const id = section.getAttribute('id');

            if (scrollPos >= top && scrollPos < top + height) {
              navLinks.forEach(l => {
                l.classList.remove('active');
              });
              const activeLink = document.querySelector(`a[href="#${id}"]`);
              if (activeLink) {
                activeLink.classList.add('active');
              }
            }
          });
        });
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", renderBOCDDList);
    </script>
  </body>
</html>
